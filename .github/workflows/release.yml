name: Create Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG=$(git tag --list --sort=-v:refname | head -n1)
          fi
          TAG="${TAG#v}"
          TAG=$(printf '%s' "$TAG" | sed -E 's/-[0-9]{12}$//')
          if [ -z "$TAG" ]; then
            echo "No git tag found; cannot stamp addon version" >&2
            exit 1
          fi
          VERSION="${TAG}-$(date -u +%Y%m%d%H%M)"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using version $VERSION"

      - name: Build BiS lists, loot pools, and stamp TOC version
        run: |
          python scripts/build_bis_lists.py --version "${{ steps.version.outputs.VERSION }}"
          git add -f Data BlingtronApp.toc

      - name: Use dated version for packager
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          git tag -l --points-at HEAD | xargs -r git tag -d
          git tag "$VERSION"
          echo "HEAD tagged as $VERSION for packager"

      - name: Create Package
        uses: BigWigsMods/packager@master
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
