name: Create Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine version
        id: version
        run: |
          BASE=$(awk '/^## Version:/{ print $3; exit }' BlingtronApp.toc | sed -E 's/-[0-9]{12}$//')
          VERSION="${BASE}-$(date -u +%Y%m%d%H%M)"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build BiS lists and stamp TOC version
        run: python scripts/build_bis_lists.py --version "${{ steps.version.outputs.VERSION }}"

      - name: Create Package
        uses: BigWigsMods/packager@master
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
